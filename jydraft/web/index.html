<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jydraft · 剪映自动剪辑</title>
<style>
  :root {
    --bg: #0c0e14;
    --panel: #151925;
    --panel-2: #1b2030;
    --field: #222839;
    --line: #2b3247;
    --text: #eef1ff;
    --muted: #99a2ba;
    --accent: #6c7cff;
    --accent-2: #8b97ff;
    --ok: #46d39a;
    --warn: #ffbf5a;
    --err: #ff6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1b2140 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #1a2b3a 0%, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .app { max-width: 1120px; margin: 0 auto; padding: 32px 28px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #3d4bd6);
    display: grid; place-items: center; font-weight: 800; font-size: 22px;
    box-shadow: 0 10px 30px rgba(108,124,255,.35);
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: .2px; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .chip {
    font-size: 12px; color: var(--muted); background: rgba(255,255,255,.04);
    border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.ok b { color: var(--ok); }
  .chip.warn b { color: var(--warn); }
  .chip.err b { color: var(--err); }
  main { display: grid; gap: 18px; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 40%), var(--panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.22);
  }
  h2 { margin: 0 0 16px; font-size: 15px; font-weight: 650; color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    width: 100%; background: var(--field); border: 1px solid var(--line);
    color: var(--text); border-radius: 11px; padding: 12px 14px; font-size: 14px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,124,255,.16); }
  input::placeholder { color: #6b7490; }
  button {
    border: 1px solid var(--line); background: var(--field); color: var(--text);
    border-radius: 11px; padding: 11px 16px; font-size: 13px; cursor: pointer;
    transition: background .15s, transform .1s, border-color .15s;
    white-space: nowrap;
  }
  button:hover { background: var(--panel-2); border-color: #3a4360; }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #4b58d8); border-color: transparent;
    font-weight: 700; padding: 13px 24px; font-size: 14px;
    box-shadow: 0 12px 26px rgba(108,124,255,.28);
  }
  button.primary:hover { background: linear-gradient(135deg, var(--accent-2), #5b68e8); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1.25fr; gap: 14px; }
  .checks { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 16px; }
  .checks label { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12px; }
  .cardhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cardhead h2 { margin: 0; }
  .status { color: var(--muted); font-size: 12px; }
  .status.running { color: var(--accent-2); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .progress { height: 5px; background: var(--field); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #9aa5ff); border-radius: 99px; }
  .progress.running .bar { animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide {
    0% { width: 8%; transform: translateX(0); }
    50% { width: 46%; transform: translateX(80%); }
    100% { width: 8%; transform: translateX(1200%); }
  }
  pre#log {
    margin: 0; max-height: 330px; overflow: auto; background: #0a0c12;
    border: 1px solid #20263a; border-radius: 12px; padding: 14px 16px;
    color: #cdd4e8; font: 12px/1.65 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .result { border-color: rgba(70,211,154,.35); }
  .result h2 { color: var(--ok); }
  .result .meta { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 14px; }
  .hidden { display: none; }
  footer { margin-top: 26px; display: flex; justify-content: space-between; color: #6f7891; font-size: 12px; }
  a { color: #9aa5ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (max-width: 760px) {
    .app { padding: 20px 14px 30px; }
    header { align-items: flex-start; flex-direction: column; }
    .chips { justify-content: flex-start; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">J</div>
      <div>
        <h1>jydraft</h1>
        <p>剪映自动剪辑 · 本地应用</p>
      </div>
    </div>
    <div class="chips" id="chips">
      <span class="chip">正在检测环境...</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>素材与指令</h2>
      <div class="field">
        <label>素材文件夹</label>
        <div class="row">
          <input type="text" id="input" placeholder="例如 /Users/you/Movies/素材">
          <button id="browseInput">选择</button>
        </div>
      </div>
      <div class="field">
        <label>剪辑要求</label>
        <input type="text" id="brief" value="30秒快节奏，配乐，带字幕" placeholder="例如 20秒快节奏竖屏，配乐，带字幕">
      </div>
      <div class="grid2">
        <div class="field">
          <label>草稿名</label>
          <input type="text" id="name">
        </div>
        <div class="field">
          <label>工作目录</label>
          <div class="row">
            <input type="text" id="work">
            <button id="browseWork">选择</button>
          </div>
        </div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="publish"> 发布到剪映首页（需先退出剪映）</label>
        <label><input type="checkbox" id="export" checked> 同时导出 MP4</label>
      </div>
      <div class="actions">
        <button class="primary" id="start">开始自动剪辑</button>
        <span class="hint">有 .srt 会自动上字幕；没有 SRT 只生成标题。按 ⌘/Ctrl + Enter 也可开始。</span>
      </div>
    </section>

    <section class="card">
      <div class="cardhead">
        <h2>运行日志</h2>
        <span class="status" id="status">就绪</span>
      </div>
      <div class="progress" id="progress"><div class="bar"></div></div>
      <pre id="log">等待开始…</pre>
    </section>

    <section class="card result hidden" id="result">
      <h2>完成</h2>
      <div class="meta" id="resultMeta"></div>
      <div class="actions">
        <button id="openOutput">打开输出目录</button>
        <button id="openJianying">打开剪映</button>
      </div>
    </section>
  </main>

  <footer>
    <span>本地运行 · 素材不会上传</span>
    <a href="#" id="shutdown">退出应用</a>
  </footer>
</div>

<script>
const TOKEN = "__JYDRAFT_TOKEN__";
const $ = (id) => document.getElementById(id);
let env = null;
let jobId = null;
let timer = null;
let lastResult = null;

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'X-Jydraft-Token': TOKEN, ...(options.headers || {}) },
  });
  let data = null;
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) {
    const error = new Error((data && (data.message || data.error)) || ('HTTP ' + response.status));
    error.data = data;
    error.status = response.status;
    throw error;
  }
  return data;
}

function chip(label, value, tone = '') {
  return `<span class="chip ${tone}">${label} <b>${value}</b></span>`;
}

async function loadEnv() {
  try {
    env = await api('/api/env');
    const chips = [];
    if (env.app_version) chips.push(chip('剪映', env.app_version, 'ok'));
    chips.push(chip('ffmpeg', env.ffmpeg ? '可用' : '缺失', env.ffmpeg ? 'ok' : 'err'));
    chips.push(chip('加解密', env.codec ? '可用' : '明文回退', env.codec ? 'ok' : 'warn'));
    chips.push(chip('剪映状态', env.editor_running ? '运行中' : '已退出', env.editor_running ? 'warn' : 'ok'));
    $('chips').innerHTML = chips.join('');
    if (!$('name').value) $('name').value = env.default_name || '';
    if (!$('work').value) $('work').value = env.default_work || '';
    if (env.errors && env.errors.length) {
      logLine('环境提示: ' + env.errors.join(' | '));
    }
  } catch (error) {
    $('chips').innerHTML = chip('环境', '检测失败', 'err');
  }
}

function logLine(text) {
  const log = $('log');
  if (log.textContent === '等待开始…') log.textContent = '';
  log.textContent += text + '\n';
  log.scrollTop = log.scrollHeight;
}

function setStatus(text, tone = '') {
  const node = $('status');
  node.textContent = text;
  node.className = 'status ' + tone;
}

async function browse(kind) {
  try {
    const data = await api('/api/browse', { method: 'POST', body: JSON.stringify({ kind }) });
    if (data.path) $(kind === 'input' ? 'input' : 'work').value = data.path;
  } catch (error) {
    setStatus(error.message, 'err');
  }
}

async function start() {
  if (jobId) return;
  const input = $('input').value.trim();
  const name = $('name').value.trim();
  if (!input) { setStatus('请选择素材文件夹', 'err'); return; }
  if (!name) { setStatus('请填写草稿名', 'err'); return; }
  const publish = $('publish').checked;
  if (publish && env && env.editor_running) {
    if (!confirm('发布需要完全退出剪映。请先保存工作。\n\n现在尝试退出剪映并继续吗？')) return;
    try {
      const data = await api('/api/quit-editor', { method: 'POST', body: '{}' });
      if (!data.closed) { setStatus('无法退出剪映，请手动退出后重试', 'err'); return; }
    } catch (error) { setStatus(error.message, 'err'); return; }
  }
  $('log').textContent = '';
  $('result').classList.add('hidden');
  lastResult = null;
  $('start').disabled = true;
  $('progress').classList.add('running');
  setStatus('运行中…', 'running');
  try {
    const data = await api('/api/start', {
      method: 'POST',
      body: JSON.stringify({
        input, brief: $('brief').value.trim(), name,
        work: $('work').value.trim(), publish, export: $('export').checked,
      }),
    });
    jobId = data.job_id;
    poll();
  } catch (error) {
    if (error.status === 409) {
      setStatus('剪映正在运行，请先退出', 'err');
    } else {
      setStatus(error.message, 'err');
    }
    reset();
  }
}

async function poll() {
  if (!jobId) return;
  try {
    const data = await api('/api/job/' + jobId);
    if (data.logs && data.logs.length) {
      $('log').textContent = data.logs.join('\n');
      $('log').scrollTop = $('log').scrollHeight;
    }
    if (data.status === 'running') {
      timer = setTimeout(poll, 650);
      return;
    }
    if (data.status === 'done') {
      lastResult = data.result;
      setStatus('完成', 'ok');
      $('progress').classList.remove('running');
      const meta = [
        '草稿：' + data.result.name,
        '时长：' + (data.result.duration_us / 1000000).toFixed(1) + ' 秒',
        '片段：' + data.result.segments,
      ];
      if (data.result.export) meta.push('视频：' + data.result.export);
      if (!data.result.published) meta.push('未登记首页（发布选项未勾选）');
      $('resultMeta').innerHTML = meta.map((line) => `<div>${escapeHtml(line)}</div>`).join('');
      $('result').classList.remove('hidden');
    } else {
      setStatus('失败', 'err');
      $('progress').classList.remove('running');
      logLine('\n' + (data.error || '未知错误'));
    }
    reset();
  } catch (error) {
    setStatus(error.message, 'err');
    reset();
  }
}

function reset() {
  if (timer) clearTimeout(timer);
  timer = null;
  jobId = null;
  $('start').disabled = false;
  $('progress').classList.remove('running');
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

$('browseInput').addEventListener('click', () => browse('input'));
$('browseWork').addEventListener('click', () => browse('work'));
$('start').addEventListener('click', start);
$('openOutput').addEventListener('click', () => {
  if (lastResult) api('/api/open', { method: 'POST', body: JSON.stringify({ path: lastResult.work }) });
});
$('openJianying').addEventListener('click', () => api('/api/launch', { method: 'POST', body: '{}' }));
$('shutdown').addEventListener('click', (event) => {
  event.preventDefault();
  api('/api/shutdown', { method: 'POST', body: '{}' }).finally(() => {
    document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;color:#99a2ba;font-family:sans-serif">jydraft 已退出，可以关闭此页面。</div>';
  });
});
document.addEventListener('keydown', (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') start();
});
loadEnv();
</script>
</body>
</html>

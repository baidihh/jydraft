name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: jydraft-macos
          - os: windows-latest
            artifact: jydraft-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Fetch static ffmpeg/ffprobe
        run: |
          npm install --no-save --no-package-lock ffmpeg-static ffprobe-static
          python scripts/fetch_tools.py
      - name: Build macOS codec helper
        if: runner.os == 'macOS'
        run: bash scripts/build_codec.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: pyinstaller jydraft.spec --noconfirm
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/jydraft dist/jydraft-macos.zip
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/jydraft -DestinationPath dist/jydraft-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true

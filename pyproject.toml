[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jydraft"
version = "1.1.0"
description = "Agent-friendly CLI that turns a folder of clips and a brief into editable Jianying drafts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=10.0"]
keywords = ["jianying", "capcut", "draft", "cli", "automation", "agent", "macos", "windows"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
jydraft = "jydraft.cli:main"

[tool.setuptools]
packages = ["jydraft"]

[tool.setuptools.package-data]
jydraft = ["blueprint.json", "native-resource-catalog.json", "web/index.html", "codec_dlopen.cpp"]
